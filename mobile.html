<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratonton Telefon Pintar · Walimatul Urus KJ & Joanne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #2A1B22 0%, #150F14 60%, #0A070A 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      color: #FDFBF7;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Header Bar */
    .sim-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .sim-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: #E27B8B;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }
    .sim-title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: #F8D7DA;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .sim-sub {
      font-size: 0.8rem;
      color: rgba(253, 251, 247, 0.65);
    }
    .sim-sub a {
      color: #FFB7C5;
      text-decoration: none;
      border-bottom: 1px dashed rgba(255, 183, 197, 0.5);
    }

    /* Phone Device Mockup Container */
    .phone-wrapper {
      position: relative;
      width: 390px;
      max-width: 95vw;
      height: 800px;
      max-height: 88vh;
      background: #1C191B;
      border-radius: 52px;
      padding: 12px;
      box-shadow: 
        0 0 0 3px #3D2D33,
        0 0 0 6px #1A1317,
        0 25px 60px -10px rgba(0, 0, 0, 0.7),
        0 0 50px rgba(226, 123, 139, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Dynamic Island / Speaker Notch */
    .phone-notch {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 24px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      gap: 6px;
    }
    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111424;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Screen Frame */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #FFFDF9;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Action Links Below */
    .sim-actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .sim-btn {
      background: rgba(226, 123, 139, 0.15);
      border: 1px solid rgba(226, 123, 139, 0.35);
      color: #FFC5CE;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.78rem;
      text-decoration: none;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sim-btn:hover {
      background: rgba(226, 123, 139, 0.3);
      color: #FFF;
      transform: translateY(-1px);
    }

    /* If opened directly on mobile screen, make it take full native screen */
    @media (max-width: 500px) {
      body {
        padding: 0;
        background: #000;
      }
      .sim-header, .sim-actions, .phone-notch {
        display: none;
      }
      .phone-wrapper {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        border: none;
      }
      .phone-screen {
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>
<body>

  <header class="sim-header">
    <span class="sim-tag">Format Skrin Telefon Pintar</span>
    <h1 class="sim-title">Tengku Khairi &amp; Joanne &bull; Mobile View</h1>
    <p class="sim-sub">Resolusi Vertikal 9:16 &bull; Dioptimumkan untuk iPhone &amp; Android</p>
  </header>

  <main class="phone-wrapper">
    <div class="phone-notch">
      <div class="camera-lens"></div>
    </div>
    <div class="phone-screen">
      <iframe src="index.html" title="RSVP Mobile Screen" allow="autoplay; fullscreen"></iframe>
    </div>
  </main>

  <footer class="sim-actions">
    <a href="index.html" class="sim-btn">🖥️ Buka Skrin Penuh Biasa</a>
    <a href="index.html?to=Dato'+Sri+Nazri+%26+Datin" class="sim-btn" target="_blank">👑 Buka Tab Baru Tetamu</a>
  </footer>

</body>
</html>
