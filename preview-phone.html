<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pratonton Format Telefon (Mobile Simulator) · KJ &amp; Joanne</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D0A0D;
      background-image: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
      font-family: 'Montserrat', system-ui, sans-serif;
      color: #F6ECE1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Top Control Toolbar */
    .sim-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      width: 100%;
      max-width: 900px;
      margin-bottom: 1.5rem;
      padding: 0.85rem 1.4rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .sim-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sim-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: #D4AF37;
      letter-spacing: 0.1em;
      font-weight: 600;
    }
    .sim-badge {
      font-size: 0.68rem;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #FFE6A8;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .sim-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sim-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #FFF;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .sim-btn:hover {
      background: rgba(212, 175, 55, 0.25);
      border-color: #D4AF37;
      color: #FFECA8;
      transform: translateY(-1px);
    }
    .sim-btn.primary {
      background: linear-gradient(135deg, #D4AF37 0%, #AA8220 100%);
      color: #1A1208;
      font-weight: 600;
      border-color: #FFF;
    }

    /* Smartphone Bezel & Case */
    .phone-container {
      position: relative;
      width: 400px;
      height: 840px;
      background: #1A141A;
      border-radius: 54px;
      padding: 12px;
      box-shadow: 
        0 0 0 4px #2D232A,
        0 0 0 7px #1A141A,
        0 25px 65px -10px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(212, 175, 55, 0.15);
      transition: all 0.3s ease;
    }

    /* Screen Frame */
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      background: #000;
    }

    /* Dynamic Island / Notch */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    .camera-lens {
      width: 11px;
      height: 11px;
      background: #080D1A;
      border: 1px solid #142238;
      border-radius: 50%;
    }
    .speaker-slot {
      width: 48px;
      height: 4px;
      background: #181818;
      border-radius: 3px;
    }

    /* Phone Home Indicator Bar at bottom */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      z-index: 999;
      pointer-events: none;
    }

    /* Iframe Hosting The Actual Wedding RSVP */
    .phone-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0E0A0E;
    }

    /* Responsive scaling for small PC screens */
    @media (max-height: 940px) {
      .phone-container {
        transform: scale(0.9);
        transform-origin: top center;
        margin-bottom: -70px;
      }
    }
    @media (max-height: 820px) {
      .phone-container {
        transform: scale(0.8);
        transform-origin: top center;
        margin-bottom: -140px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Simulator Bar -->
  <header class="sim-toolbar">
    <div class="sim-brand">
      <span class="sim-logo">KJ &amp; JOANNE</span>
      <span class="sim-badge">FORMAT TELEFON • HD (390×844)</span>
    </div>

    <div class="sim-actions">
      <button type="button" class="sim-btn" id="btnReload" title="Muat Semula">
        🔄 Muat Semula
      </button>
      <a href="./index.html" class="sim-btn" id="btnFullTab" target="_blank" title="Buka Tab Penuh">
        ↗ Buka Skrin Penuh
      </a>
      <a href="http://localhost:5500/?to=Dato'%20Sri%20Nazri%20%26%20Datin" class="sim-btn" id="btnLocalHostLink">
        💻 Localhost
      </a>
      <a href="https://khairi-joanne.vercel.app/?to=Dato'%20Sri%20Nazri%20%26%20Datin" class="sim-btn primary" id="btnLivePhoneLink" target="_blank">
        📱 Link Telefon Sebenar
      </a>
    </div>
  </header>

  <!-- Phone Mockup Container -->
  <main class="phone-container">
    <div class="dynamic-island">
      <div class="camera-lens"></div>
      <div class="speaker-slot"></div>
    </div>
    <div class="home-indicator"></div>

    <div class="phone-screen">
      <iframe class="phone-iframe" id="mobileIframe" src="./index.html" allow="autoplay; fullscreen"></iframe>
    </div>
  </main>

  <script>
    // Forward any query params (e.g. ?to=Dato' Sri Nazri & Datin) into the iframe & links
    const search = window.location.search;
    const iframe = document.getElementById("mobileIframe");
    const fullTabBtn = document.getElementById("btnFullTab");
    const localHostBtn = document.getElementById("btnLocalHostLink");
    const livePhoneBtn = document.getElementById("btnLivePhoneLink");
    const reloadBtn = document.getElementById("btnReload");

    if (search) {
      iframe.src = "./index.html" + search;
      fullTabBtn.href = "./index.html" + search;
      localHostBtn.href = "http://localhost:5500/" + search;
      livePhoneBtn.href = "https://khairi-joanne.vercel.app/" + search;
    }

    reloadBtn.addEventListener("click", () => {
      iframe.src = iframe.src;
    });
  </script>

</body>
</html>
